<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Newsreel</title>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=DM+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --nr-red:#FF6343; --nr-yellow:#EDBD1F; --nr-green:#1AAD17;
    --nr-black:#000; --nr-charcoal:#0F0F0F; --nr-lead:#1F1F1F; --nr-iron:#3A3A3A;
    --nr-ash:#898989; --nr-silver:#ADADAD; --nr-smoke:#C8C8C8; --nr-white:#FFF;
    --font-h:'Bree Serif',serif; --font-b:'DM Sans',sans-serif; --font-m:'IBM Plex Mono',monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#000; color:var(--nr-white); font-family:var(--font-b); overflow:hidden; }

  .phone { width:100%; max-width:430px; height:100vh; margin:0 auto; background:#000; position:relative; overflow:hidden; }

  /* ─────────── FEED ─────────── */
  .feed { position:absolute; inset:0; transition:transform 0.4s cubic-bezier(0.2,0.8,0.2,1), opacity 0.3s ease; }
  .feed.hidden { transform:translateX(-12%); opacity:0; pointer-events:none; }

  .stories { position:absolute; inset:0; }
  .story { position:absolute; inset:0; transition:transform 0.4s cubic-bezier(0.2,0.8,0.2,1); }
  .story.next { transform:translateY(100%); }
  .story.prev { transform:translateY(-100%); }

  .slide-track { display:flex; height:100%; width:100%; transition:transform 0.35s cubic-bezier(0.2,0.8,0.2,1); will-change:transform; }
  .slide { flex:0 0 100%; height:100%; position:relative; background:#000; }
  .slide-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; user-select:none; -webkit-user-drag:none; }
  .slide::before { content:""; position:absolute; left:0; right:0; top:0; height:200px; background:linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); pointer-events:none; z-index:1; }
  .slide::after  { content:""; position:absolute; left:0; right:0; bottom:0; height:340px; background:linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.55) 50%, transparent 100%); pointer-events:none; z-index:1; }

  /* Top chrome: status row + segmented progress */
  .top-chrome { position:absolute; top:60px; left:0; right:0; z-index:5; padding:0 18px; }
  .top-row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; min-height:34px; margin-bottom:14px; }
  .top-row > :first-child { justify-self:start; }
  .top-row > :last-child  { justify-self:end; }
  .stack-counter { font-family:var(--font-m); font-size:11px; font-weight:500; letter-spacing:0.16em; color:rgba(255,255,255,0.85); text-shadow:0 1px 4px rgba(0,0,0,0.5); }
  .nr-mark { display:flex; align-items:center; gap:6px; cursor:pointer; filter:drop-shadow(0 1px 6px rgba(0,0,0,0.5)); }
  .nr-mark img { height:22px; width:auto; display:block; }
  .nr-mark svg { width:11px; height:11px; color:rgba(255,255,255,0.85); }
  .me-avatar { width:32px; height:32px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.85); cursor:pointer; padding:0; overflow:hidden; background:var(--nr-iron); }
  .me-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  /* Story-progress dots — design system pattern (app.html .car-dot) */
  .segs { display:flex; gap:5px; justify-content:center; align-items:center; height:8px; }
  .segs.single { display:none; }
  .seg { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.22); transition:background 0.25s ease, transform 0.25s ease, width 0.25s ease; }
  .seg-fill { display:none; }
  .seg.done { background:rgba(255,255,255,0.55); }
  .seg.on { background:var(--nr-red); width:18px; border-radius:3px; }

  /* Video controls (only pause + volume — no fullscreen) */
  .vc { position:absolute; top:130px; left:14px; z-index:4; display:flex; gap:8px; }
  .vc-btn {
    width:38px; height:38px; border-radius:50%;
    background:rgba(0,0,0,0.45); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
    border:none; cursor:pointer; color:#fff;
  }
  .vc-btn svg { width:15px; height:15px; }

  /* Right-side action stack — speaker / CC / share / streak / Benny */
  .side-actions { position:absolute; right:10px; top:50%; transform:translateY(-50%); z-index:4;
    display:flex; flex-direction:column; gap:14px; align-items:center; }
  .sa-btn { width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; color:#fff;
    background:rgba(0,0,0,0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; padding:0; }
  .sa-btn svg { width:18px; height:18px; }
  .sa-btn--streak {
    position:relative; background:transparent;
    background-image:conic-gradient(var(--nr-red) 65%, rgba(255,255,255,0.15) 0);
    -webkit-mask:radial-gradient(circle, transparent 14px, #000 14px);
            mask:radial-gradient(circle, transparent 14px, #000 14px);
  }
  .sa-btn--benny { background:rgba(237,189,31,0.18); border:1px solid rgba(237,189,31,0.6); padding:4px; }
  .sa-btn--benny img { width:100%; height:100%; object-fit:contain; }

  /* ─────────── BENNY ASSISTANT SHEET ─────────── */
  .ba-scrim { position:absolute; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(2px); z-index:50; opacity:0; pointer-events:none; transition:opacity 0.25s ease; }
  .ba-scrim.on { opacity:1; pointer-events:auto; }
  .ba-sheet { position:absolute; left:16px; right:64px; bottom:120px; z-index:51; display:flex; flex-direction:column; gap:10px;
    transform:translateY(20px); opacity:0; pointer-events:none; transition:transform 0.3s cubic-bezier(0.2,0.8,0.2,1), opacity 0.25s ease; }
  .ba-scrim.on ~ .ba-sheet, .ba-sheet.on { transform:translateY(0); opacity:1; pointer-events:auto; }
  .ba-card { background:rgba(15,15,15,0.85); backdrop-filter:blur(10px);
    border:1px solid rgba(237,189,31,0.55); border-radius:18px; padding:16px 18px; cursor:pointer; text-align:left;
    color:#fff; transition:border-color 0.15s, transform 0.1s ease; }
  .ba-card:hover { border-color:rgba(237,189,31,0.85); }
  .ba-card:active { transform:scale(0.98); }
  .ba-card-title { font-family:var(--font-h); font-size:18px; line-height:1.2; margin-bottom:4px; }
  .ba-card-sub { font-family:var(--font-b); font-size:13px; line-height:1.4; color:var(--nr-silver); }
  .ba-answer { background:rgba(15,15,15,0.92); backdrop-filter:blur(10px); border:1px solid var(--nr-iron); border-radius:18px; padding:18px; color:#fff; }
  .ba-answer-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .ba-answer-head img { width:22px; height:22px; }
  .ba-answer-label { font-family:var(--font-m); font-size:10px; letter-spacing:0.18em; color:var(--nr-yellow); text-transform:uppercase; font-weight:600; }
  .ba-answer-body { font-family:var(--font-b); font-size:15px; line-height:1.5; color:var(--nr-smoke); }
  .ba-close { position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,0.5); border:none; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .ba-close svg { width:14px; height:14px; }

  /* Subtitle */
  .subtitle { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); z-index:2;
    background:rgba(0,0,0,0.55); color:#fff; font-size:15px; font-weight:500;
    padding:6px 12px; border-radius:6px; backdrop-filter:blur(4px); pointer-events:none;
    max-width:80%; text-align:center; line-height:1.35; }

  /* Bottom overlay: author chip → headline → read more */
  .b-overlay { position:absolute; left:0; right:0; bottom:96px; z-index:3; padding:0 18px; transition:bottom 0.3s ease; }
  /* Compact mode = slides 2+ : just a tiny author chip, no headline/tag */
  .b-overlay.compact .b-eyebrow-row,
  .b-overlay.compact .b-headline { display:none; }
  .b-overlay.compact { bottom:72px; }
  .b-overlay.compact .author-chip { padding:4px 12px 4px 4px; background:rgba(0,0,0,0.4); }
  .b-overlay.compact .author-av { width:24px; height:24px; }
  .b-overlay.compact .author-name { font-size:13px; font-weight:500; }
  .b-overlay.compact .author-verif { width:12px; height:12px; }
  /* Hide bottom author overlay completely on Benny slide */
  .b-overlay.hidden-overlay { display:none; }
  .author-chip {
    display:inline-flex; align-items:center; gap:8px; padding:5px 14px 5px 5px; border-radius:999px;
    background:rgba(0,0,0,0.5); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1);
    color:#fff; cursor:pointer; margin-bottom:10px;
  }
  .author-av { width:28px; height:28px; border-radius:50%; object-fit:cover; background:var(--nr-iron); }
  .author-name { font-family:var(--font-b); font-size:14px; font-weight:600; }
  .author-verif { width:14px; height:14px; flex-shrink:0; }
  .b-eyebrow-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .b-eyebrow { font-family:var(--font-m); font-size:11px; font-weight:500; letter-spacing:0.22em; color:rgba(255,255,255,0.6); text-transform:uppercase; }
  .b-impact-pill { display:inline-flex; align-items:center; gap:5px; padding:3px 8px 3px 4px; border-radius:999px;
    background:rgba(255,99,67,0.16); border:1px solid rgba(255,99,67,0.45);
    font-family:var(--font-m); font-size:9px; font-weight:600; letter-spacing:0.12em; color:#FFD9CC; text-transform:uppercase; }
  .b-impact-pill img { width:14px; height:14px; }
  .b-headline { font-family:var(--font-h); font-size:28px; line-height:1.15; color:#fff; margin-bottom:8px; text-shadow:0 1px 8px rgba(0,0,0,0.4); }
  .b-read { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-b); font-size:14px; font-weight:500; color:#fff; background:none; border:none; cursor:pointer; padding:6px 0; text-shadow:0 1px 6px rgba(0,0,0,0.5); }
  .b-read-row { display:flex; justify-content:flex-end; }

  /* Tabs */
  .tabs { position:absolute; left:0; right:0; bottom:0; z-index:6;
    display:flex; justify-content:space-around; align-items:flex-start;
    padding:8px 8px 28px;
    background:linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0)); }
  .tab { background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; color:rgba(255,255,255,0.6); padding:6px 8px; }
  .tab svg { width:22px; height:22px; }
  .tab-label { font-family:var(--font-b); font-size:10px; font-weight:500; }
  .tab.active { color:var(--nr-red); }

  /* ─────────── QUIZ SLIDE OVERLAY ─────────── */
  .slide--quiz { background:#000; }
  .slide--quiz::before, .slide--quiz::after { display:none; }
  .quiz-wrap { position:absolute; inset:0; padding:140px 68px 140px 24px; display:flex; flex-direction:column; }
  .quiz-q { font-family:var(--font-b); font-size:18px; line-height:1.4; color:#fff; text-align:center; margin-bottom:28px; }
  .quiz-opts { display:flex; flex-direction:column; gap:12px; }
  .quiz-opt { background:transparent; border:1px solid var(--nr-iron); color:#fff; border-radius:14px; padding:16px 18px; font-family:var(--font-b); font-size:15px; text-align:left; cursor:pointer; transition:border-color 0.15s, background 0.15s; }
  .quiz-opt:hover { border-color:var(--nr-silver); background:rgba(255,255,255,0.03); }
  .quiz-opt.right { border-color:var(--nr-green); background:rgba(26,173,23,0.1); }
  .quiz-opt.wrong { border-color:var(--nr-red); background:rgba(255,99,67,0.1); }

  /* ─────────── BENNY (Story Impact) SLIDE ─────────── */
  .slide--benny { background:radial-gradient(ellipse at 50% 55%, #1a0a07 0%, #000 65%); }
  .slide--benny::before, .slide--benny::after { display:none; }
  .bn-stage { position:absolute; inset:0; padding:120px 68px 110px 24px; display:flex; flex-direction:column; }
  .bn-context { font-family:var(--font-m); font-size:10px; letter-spacing:0.24em; color:var(--nr-ash); text-transform:uppercase; margin-bottom:10px; transition:opacity 0.3s ease; }
  .bn-headline { font-family:var(--font-h); font-size:20px; line-height:1.22; color:#fff; margin-bottom:0; transition:font-size 0.5s ease, opacity 0.4s ease, margin 0.4s ease; }
  .bn-orb-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; transition:flex 0.6s cubic-bezier(0.2,0.8,0.2,1), margin 0.4s ease; margin-top:0; }
  /* Opened state — give every chunk breathing room */
  .slide--benny.opened .bn-context { display:none; }
  .slide--benny.opened .bn-headline { margin-bottom:24px; }
  .slide--benny.opened .bn-orb-wrap { margin-bottom:28px; }
  .bn-orb-btn { position:relative; width:200px; height:200px; border-radius:50%; border:none; padding:0; background:transparent; cursor:pointer;
    transition:width 0.6s cubic-bezier(0.2,0.8,0.2,1), height 0.6s cubic-bezier(0.2,0.8,0.2,1); }
  .bn-orb-btn:active { transform:scale(0.97); transition:transform 0.12s ease; }
  .bn-aura { position:absolute; inset:-55px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,99,67,0.45) 0%, rgba(255,99,67,0.18) 32%, rgba(255,99,67,0) 62%);
    filter:blur(8px); animation:bnAura 3.6s ease-in-out infinite; }
  .bn-aura.two { inset:-25px; background:radial-gradient(circle, rgba(255,140,80,0.55) 0%, rgba(255,99,67,0) 60%); animation-delay:-1.2s; animation-duration:4.4s; }
  @keyframes bnAura { 0%,100% { opacity:0.7; transform:scale(0.96); } 50% { opacity:1; transform:scale(1.06); } }
  .bn-disc { position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #FF8966 0%, #FF6343 45%, #C84527 100%);
    box-shadow: inset 0 -22px 40px rgba(0,0,0,0.35), inset 0 8px 24px rgba(255,255,255,0.18), 0 14px 50px rgba(255,99,67,0.45);
  }
  .bn-mascot { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .bn-mascot img { width:64%; height:64%; object-fit:contain; animation:bnIdle 5.2s ease-in-out infinite; transform-origin:50% 60%; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
  /* "For you" chip below the orb (tasteful, not jammed inside) */
  .bn-foryou { display:inline-flex; align-items:center; gap:8px; padding:5px 14px 5px 5px; border-radius:999px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#fff;
    font-family:var(--font-m); font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; }
  .bn-foryou img { width:24px; height:24px; border-radius:50%; object-fit:cover; }
  /* Story Impact eyebrow — prominent header */
  .bn-impact-label { display:inline-flex; align-items:center; gap:6px; padding:5px 12px 5px 5px; border-radius:999px;
    background:rgba(255,99,67,0.14); border:1px solid rgba(255,99,67,0.45);
    font-family:var(--font-m); font-size:10px; font-weight:600; letter-spacing:0.2em; color:#FFD9CC; text-transform:uppercase;
    margin-bottom:14px; align-self:flex-start; }
  .bn-impact-label img { width:18px; height:18px; }
  /* Concentric ripples (pre-tap = breathing; post-tap = bursting) */
  .bn-ripple { position:absolute; inset:0; border-radius:50%; border:2px solid rgba(255,99,67,0.55); opacity:0; pointer-events:none; }
  .slide--benny.opened .bn-ripple { animation:bnRipple 1.4s ease-out 0.05s 1; }
  .slide--benny.opened .bn-ripple.r2 { animation-delay:0.3s; }
  .slide--benny.opened .bn-ripple.r3 { animation-delay:0.55s; }
  @keyframes bnRipple {
    0% { transform:scale(0.85); opacity:0.9; }
    100% { transform:scale(2.4); opacity:0; }
  }
  @keyframes bnIdle { 0%,100% { transform:rotate(-2deg) translateY(0); } 50% { transform:rotate(2deg) translateY(-3px); } }
  .bn-hint { font-family:var(--font-m); font-size:11px; letter-spacing:0.18em; color:var(--nr-silver); text-transform:uppercase; animation:bnHintPulse 2.4s ease-in-out infinite; }
  @keyframes bnHintPulse { 0%,100% { opacity:0.55; } 50% { opacity:1; } }

  .slide--benny.opened .bn-orb-wrap { flex:0 0 auto; flex-direction:row; align-items:center; justify-content:flex-start; gap:12px; padding-top:0; }
  .slide--benny.opened .bn-orb-btn { width:52px; height:52px; min-width:52px; pointer-events:none; }
  .slide--benny.opened .bn-aura { inset:-6px; filter:blur(3px); animation:none; opacity:0.7; }
  .slide--benny.opened .bn-aura.two { inset:-3px; animation:none; opacity:0.5; }
  .slide--benny.opened .bn-headline { font-size:15px; opacity:0.6; }
  .slide--benny.opened .bn-hint,
  .slide--benny.opened .bn-impact-label,
  .slide--benny.opened .bn-foryou { display:none; }
  .slide--benny.opened .bn-byline { display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
  .bn-byline { display:none; }
  .bn-byline-label { font-family:var(--font-m); font-size:10px; letter-spacing:0.18em; color:var(--nr-red); text-transform:uppercase; }
  .bn-byline-name { font-family:var(--font-h); font-size:18px; color:#fff; }

  .bn-take { position:relative; max-height:0; overflow:hidden; opacity:0; transition:max-height 0.7s cubic-bezier(0.2,0.8,0.2,1), opacity 0.5s ease 0.15s; }
  .slide--benny.opened .bn-take { max-height:60vh; opacity:1; }
  .bn-take-body { font-family:var(--font-h); font-size:19px; line-height:1.35; color:#fff; margin-bottom:16px; }
  .bn-take-body em { color:var(--nr-red); font-style:normal; }
  /* Shimmer sweep across the take body when it reveals */
  .bn-take::after { content:""; position:absolute; inset:0; pointer-events:none; border-radius:14px;
    background:linear-gradient(110deg, transparent 30%, rgba(255,99,67,0.2) 50%, transparent 70%);
    background-size:220% 100%; background-position:-100% 0; opacity:0; }
  .slide--benny.opened .bn-take::after { animation:bnShimmer 1.6s cubic-bezier(0.4,0,0.2,1) 0.4s 1; }
  @keyframes bnShimmer {
    0% { background-position:-100% 0; opacity:0; }
    20% { opacity:1; }
    80% { opacity:1; }
    100% { background-position:200% 0; opacity:0; }
  }
  .bn-take-meta-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .bn-take-meta-label { font-family:var(--font-m); font-size:10px; font-weight:600; letter-spacing:0.18em; color:var(--nr-silver); text-transform:uppercase; }
  .bn-take-edit { font-family:var(--font-m); font-size:10px; font-weight:600; letter-spacing:0.18em; color:var(--nr-red); text-transform:uppercase; background:none; border:none; cursor:pointer; padding:4px 0; }
  .bn-take-meta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .bn-take-chip { font-family:var(--font-m); font-size:10px; letter-spacing:0.12em; color:var(--nr-silver); text-transform:uppercase; padding:5px 9px; border:1px solid var(--nr-iron); border-radius:999px; cursor:pointer; transition:border-color 0.15s, color 0.15s; }
  .bn-take-chip.editable { border-color:var(--nr-red); color:#fff; border-style:dashed; }
  .bn-take-chip[contenteditable="true"] { outline:none; }

  /* ─────────── XP SLIDE ─────────── */
  .slide--xp { background:#000; }
  .slide--xp::before, .slide--xp::after { display:none; }
  .xp-wrap { position:absolute; inset:0; padding:140px 68px 130px 24px; display:flex; flex-direction:column; align-items:center; }
  .xp-streak { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .xp-streak-icon { width:34px; height:34px; }
  .xp-streak-num { font-family:var(--font-b); font-size:38px; font-weight:700; color:#fff; line-height:1; }
  .xp-msg { font-family:var(--font-b); font-size:18px; color:var(--nr-smoke); text-align:center; line-height:1.35; margin-bottom:34px; }
  .xp-cards { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:340px; margin-bottom:30px; }
  .xp-card { background:var(--nr-lead); border-radius:14px; padding:16px; }
  .xp-card-label { font-family:var(--font-b); font-weight:600; font-size:11px; letter-spacing:0.18em; color:var(--nr-silver); text-transform:uppercase; margin-bottom:10px; }
  .xp-card-val { display:flex; align-items:center; gap:8px; font-family:var(--font-b); font-size:26px; font-weight:700; color:#fff; }
  .xp-card-val svg { width:22px; height:22px; }
  .xp-ring { position:relative; width:200px; height:200px; margin-bottom:18px; }
  .xp-ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .xp-ring-bg { stroke:var(--nr-lead); fill:none; stroke-width:14; }
  .xp-ring-fg { stroke:var(--nr-red); fill:none; stroke-width:14; stroke-linecap:round; stroke-dasharray:565; stroke-dashoffset:565; transition:stroke-dashoffset 1s ease; }
  .xp-ring-text { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }

<script>

const stage = document.getElementById('stories');

function renderSlide(sl, i, k) {
  if (sl.type === 'xp') {
    const pct = sl.levelCurrent / sl.levelMax;
    const dash = 565 * (1 - pct);
    return `
      <div class="slide slide--xp">

            </div>
            <div class="xp-card">

              <div class="xp-card-val" style="color:#A78BFA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><polyline points="8 12 11 15 16 9"/></svg>${sl.quizXp}</div>
            </div>
          </div>
          <div class="xp-ring">
            <svg viewBox="0 0 200 200">
              <circle class="xp-ring-bg" cx="100" cy="100" r="90"/>
              <circle class="xp-ring-fg" cx="100" cy="100" r="90" style="stroke-dashoffset:${dash}"/>

            </div>
          </div>
          <button class="xp-claim">CLAIM XP</button>
        </div>
      </div>

  }

    return `

          <div class="bn-context">${sl.context}</div>

              <div class="bn-aura"></div>
              <div class="bn-aura two"></div>
              <div class="bn-disc"></div>
              <div class="bn-mascot"><img src="assets/benny/benny-paperboy-v2-transparent.png" alt=""></div>

              <div class="bn-ripple r2"></div>

          </div>
          <div class="bn-take">
            <p class="bn-take-body">${sl.take}</p>
            <div class="bn-take-meta-head">
              <span class="bn-take-meta-label">Based on you</span>
              <button class="bn-take-edit" onclick="toggleBennyEdit(${i}, ${k})" id="bnEdit-${i}-${k}">Edit</button>

function renderStory(s, i) {
  const c = CREATORS[s.creatorId];
  const slidesHtml = s.slides.map((sl, k) => renderSlide(sl, i, k)).join('');
  const segsHtml = s.slides.map((_, k) =>
    `<div class="seg ${k===0?'on':''}"><div class="seg-fill"></div></div>`
  ).join('');

  return `

      <div class="top-chrome">

          <span class="stack-counter">${i+1} / ${STORIES.length}</span>

        <div class="b-eyebrow-row">
          <span class="b-eyebrow">${s.tag}</span>

function render() {
  stage.innerHTML = STORIES.map(renderStory).join('');

}

function updateSegs() {
  const segs = document.querySelector(`.segs[data-story="${storyIdx}"]`);
  if (!segs) return;
  [...segs.children].forEach((s, k) => {
    s.classList.remove('on','done');
    if (k < slideIdx[storyIdx]) s.classList.add('done');
    else if (k === slideIdx[storyIdx]) s.classList.add('on');
  });
}

function goStory(i) {
  if (i < 0 || i >= STORIES.length) return;
  storyIdx = i;
  document.querySelectorAll('.story').forEach((el, j) => {
    el.classList.remove('next','prev');
    if (j < storyIdx) el.classList.add('prev');
    else if (j > storyIdx) el.classList.add('next');
  });
  document.querySelectorAll('.dev button').forEach((b,j) => { if (j<3) b.classList.toggle('on', j===storyIdx); });
  updateSegs();
}

function goSlide(storyI, k) {
  const s = STORIES[storyI];
  if (k < 0 || k >= s.slides.length) return;
  slideIdx[storyI] = k;
  const track = document.querySelector(`.slide-track[data-story="${storyI}"]`);
  track.style.transform = `translateX(-${k * 100}%)`;
  const overlay = document.querySelector(`.story[data-i="${storyI}"] .b-overlay`);
  if (overlay) {
    overlay.classList.toggle('compact', k > 0);
    const hideTypes = ['benny','xp'];
    overlay.classList.toggle('hidden-overlay', hideTypes.includes(s.slides[k].type));
  }
  // Reset any opened Benny slides we navigated away from
  document.querySelectorAll('.slide--benny.opened').forEach(el => {
    if (el.id !== `bn-${storyI}-${k}`) el.classList.remove('opened');
  });
  updateSegs();
}

function openBenny(i, k) {
  document.getElementById(`bn-${i}-${k}`)?.classList.add('opened');
}

const BENNY_ANSWERS = {
  eli5:  "The Fed left interest rates the same. They might lower them once before the year ends. That's it.",
  deeper:"Holding rates means the Fed is fighting two things at once — inflation that's still above target, and a job market that's softening. One cut by year-end is the smallest possible signal that they're paying attention.",
  matter:"Rates touch everything you pay for on credit. Mortgages, car loans, the rate on your savings, your student-loan refi. One cut barely moves the needle — your bills aren't getting cheaper any time soon."
};

function openBennyAssist(storyI) {
  document.getElementById('baScrim').classList.add('on');
  document.getElementById('baSheet').classList.add('on');
}
function closeBennyAssist() {
  document.getElementById('baScrim').classList.remove('on');
  document.getElementById('baSheet').classList.remove('on');
  // Reset cards if an answer was shown
  const sheet = document.getElementById('baSheet');
  if (sheet.dataset.mode === 'answer') { sheet.dataset.mode = ''; renderBennyCards(); }
}
function renderBennyCards() {
  document.getElementById('baSheet').innerHTML = `
    <button class="ba-card" onclick="bennyAnswer('eli5')">
      <div class="ba-card-title">Explain like I'm five</div>
      <div class="ba-card-sub">Summarizes this slide in clear, simple language.</div>
    </button>
    <button class="ba-card" onclick="bennyAnswer('deeper')">
      <div class="ba-card-title">Dig deeper</div>
      <div class="ba-card-sub">Adds one layer of insight by unpacking what it really means.</div>
    </button>
    <button class="ba-card" onclick="bennyAnswer('matter')">
      <div class="ba-card-title">Why does this matter?</div>
      <div class="ba-card-sub">Shows why this slide is significant in the broader story.</div>
    </button>`;
}
function bennyAnswer(key) {
  const sheet = document.getElementById('baSheet');
  sheet.dataset.mode = 'answer';
  sheet.innerHTML = `
    <div class="ba-answer">
      <div class="ba-answer-head">
        <img src="assets/benny/benny-paperboy-v2-transparent.png" alt="">
        <span class="ba-answer-label">Benny</span>
      </div>
      <div class="ba-answer-body">${BENNY_ANSWERS[key]}</div>
    </div>
    <button class="ba-card" onclick="closeBennyAssist()" style="text-align:center; padding:10px;">
      <div class="ba-card-sub" style="font-family:var(--font-m); letter-spacing:0.18em; text-transform:uppercase; font-size:11px;">Done</div>
    </button>`;
}

function toggleBennyEdit(i, k) {
  const wrap = document.getElementById(`bnChips-${i}-${k}`);
  const btn = document.getElementById(`bnEdit-${i}-${k}`);
  const editing = wrap.classList.toggle('editing');
  btn.textContent = editing ? 'Done' : 'Edit';
  wrap.querySelectorAll('.bn-take-chip').forEach(c => {
    c.classList.toggle('editable', editing);
    c.contentEditable = editing;
    if (editing) c.focus();
  });
}

function answerQuiz(i, k, oi) {
  const s = STORIES[i].slides[k];
  const opts = document.querySelectorAll(`.story[data-i="${i}"] .slide-track .slide`)[k].querySelectorAll('.quiz-opt');
  opts.forEach((b, j) => {
    if (j === s.answer) b.classList.add('right');
    else if (j === oi) b.classList.add('wrong');
    b.disabled = true;
  });
}

// ─── Touch handling: axis-lock vertical/horizontal ───
let tx=null, ty=null, axis=null;
document.addEventListener('touchstart', e => {
  if (creatorEl.classList.contains('on')) return;
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; axis = null;
}, {passive:true});
document.addEventListener('touchmove', e => {
  if (tx === null || axis) return;
  const dx = e.touches[0].clientX - tx;
  const dy = e.touches[0].clientY - ty;
  if (Math.abs(dx) > 12 || Math.abs(dy) > 12) {
    axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
}, {passive:true});
document.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (axis === 'y' && Math.abs(dy) > 60) goStory(storyIdx + (dy < 0 ? 1 : -1));
  else if (axis === 'x' && Math.abs(dx) > 50) goSlide(storyIdx, slideIdx[storyIdx] + (dx < 0 ? 1 : -1));
  tx = ty = axis = null;
});

let wheelLock = false;
document.addEventListener('wheel', e => {
  if (creatorEl.classList.contains('on')) return;
  if (wheelLock || Math.abs(e.deltaY) < 30) return;
  wheelLock = true;
  goStory(storyIdx + (e.deltaY > 0 ? 1 : -1));
  setTimeout(() => wheelLock = false, 500);
}, {passive:true});

document.addEventListener('keydown', e => {
  if (creatorEl.classList.contains('on') && e.key === 'Escape') return closeCreator();
  if (e.key === 'ArrowDown') goStory(storyIdx + 1);
  if (e.key === 'ArrowUp')   goStory(storyIdx - 1);
  if (e.key === 'ArrowRight') goSlide(storyIdx, slideIdx[storyIdx] + 1);
  if (e.key === 'ArrowLeft')  goSlide(storyIdx, slideIdx[storyIdx] - 1);
});

// ─── Creator profile ───

function openCreator(id) {
  creatorEl.innerHTML = renderCreator(CREATORS[id]);
  creatorEl.classList.add('on');
  feedEl.classList.add('hidden');
}
function closeCreator() {
  creatorEl.classList.remove('on');
  feedEl.classList.remove('hidden');
}

render();
</script>
